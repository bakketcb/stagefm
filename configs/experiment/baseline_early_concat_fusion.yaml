# The rejected alternative named in Methods Sec. 4.6: early concatenation of the stream vectors instead of cross-attention.
# Anchor: Methods Sec. 4.6
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: baseline_early_concat_fusion
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: early_concat
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
