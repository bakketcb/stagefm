# Pre-specified sensitivity analysis excluding examinations staged by tumour-board consensus rather than resection.
# Anchor: Methods Sec. 4.11
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: supplementary_sensitivity_consensus_exclusion
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
