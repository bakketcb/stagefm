# Table 4 row 'Task-specific backbone': a backbone trained from scratch for this task instead of an adapted frozen encoder.
# Anchor: Table 4 row 14; Sec. 2.3
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: baseline_task_specific_backbone
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {adaptation: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
