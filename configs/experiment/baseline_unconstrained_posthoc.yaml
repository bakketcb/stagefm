# Table 3 arm B7: independent heads with feasibility applied to the output distribution after the fact.
# Anchor: Table 3 arm B7; Sec. 2.2; Methods Sec. 4.6
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: baseline_unconstrained_posthoc
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {stage_consistency: true
      risk_control: true
      ordinal: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: true
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
