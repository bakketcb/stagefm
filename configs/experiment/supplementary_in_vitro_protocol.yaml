# In vitro analysis: tube-formation index and phosphorylation ratios against the matched control, with the plate as a blocking factor.
# Anchor: Sec. 2.10; Methods Sec. 4.10
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: supplementary_in_vitro_protocol
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
