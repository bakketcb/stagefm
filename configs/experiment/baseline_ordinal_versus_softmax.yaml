# The rejected alternative named in Methods Sec. 4.6: unordered categorical heads in place of the cumulative-link heads.
# Anchor: Methods Sec. 4.6
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: baseline_ordinal_versus_softmax
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {ordinal: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
