# Table 4 row 'Without radiomic descriptors', marked non-monotonic in the manuscript: removing them raises the metastatic-axis area while worsening the clinical endpoint.
# Anchor: Table 4 row 12 (dagger); Sec. 2.3
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: ablation_without_radiomic_descriptors
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {radiomics: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
