# Fig. 2 analysis: per-site nodal and tumour error against the site median harvested node count, with the 16-node restriction.
# Anchor: Sec. 2.4; Fig. 2; Algorithm 4
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: supplementary_ascertainment_analysis
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
