# Table 4 row 'Without stage consistency (I1)': the joint distribution is not projected onto the achievable set.
# Anchor: Table 4 row 2; Sec. 2.3; Methods Sec. 4.5
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: ablation_without_stage_consistency
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {stage_consistency: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
