# Table 4 row 'Without risk control (I2)': the site-conditional calibration and the per-stratum threshold are removed.
# Anchor: Table 4 row 3; Sec. 2.3; Methods Sec. 4.5
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: ablation_without_risk_control
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {risk_control: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
