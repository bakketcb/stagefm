# Sec. 2.5 analysis: adequacy, Lauren type, neoadjuvant exposure, sex, age band and scanner vendor families, each corrected separately.
# Anchor: Sec. 2.5; Methods Sec. 4.11
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: supplementary_subgroup_analysis
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
