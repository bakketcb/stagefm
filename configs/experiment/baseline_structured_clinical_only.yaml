# Single-modality arm: the structured clinical covariates alone.
# Anchor: Methods Sec. 4.8 (clinical-only arm)
extends:
  data: data/cohort.yaml
  model: model/default.yaml
  train: train/default.yaml

experiment:
  name: baseline_structured_clinical_only
  seed: 0
  streams: [ct, radiomics, clinical, endoscopy, pathology]
  ablations: {ct: true
      radiomics: true
      endoscopy: true
      pathology: true}
  evaluation:
    output_dir: runs
    achievable_rule: staging
    bootstrap_resamples: 2000
    fusion_strategy: cross_attention
    post_hoc_projection: false
    synthetic:
      site_dispersion: 0.30
      feature_noise: 0.55
      endoscopy_hint_weight: 0.35
